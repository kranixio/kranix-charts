# Default values for kranix umbrella chart
# This is a YAML-formatted file.

# Cluster-wide PriorityClass resources referenced by workloads (kranix-* names).
priorityClasses:
  enabled: true

global:
  image:
    registry: ghcr.io/kranix-io
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: kranix
  namespace: kranix-system

kranix-core:
  enabled: true
  replicas: 1
  image:
    tag: "latest"
  config:
    reconcile_interval: 15s
    max_concurrent_reconciles: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Production-ready profile preset
  productionReady:
    enabled: false
    replicas: 3
    podDisruptionBudget:
      enabled: true
      minAvailable: 2
    antiAffinity:
      enabled: true
      type: hard
  # OpenTelemetry configuration
  opentelemetry:
    enabled: false
    endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    tracing:
      enabled: true
      samplingRatio: 1.0
    metrics:
      enabled: true
      port: 9464
      path: /metrics
    resourceAttributes:
      service.name: kranix-core
      deployment.environment: production
  # Pre-upgrade validation hook
  preUpgradeHook:
    enabled: false
    image:
      repository: bitnami/kubectl
      tag: "latest"
      pullPolicy: IfNotPresent
    checks:
      resources:
        enabled: true
        minCpu: "100m"
        minMemory: "128Mi"
      dependencies:
        enabled: true
        services: []
      secrets:
        enabled: true
        required:
          - kranix-postgres-secret
  # Resource sizing calculator
  resourceCalculator:
    enabled: false
    workloadCount: 100
    tier: small

kranix-api:
  enabled: true
  replicas: 2
  image:
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: nginx
    host: kranix.example.com
    tls: true
  auth:
    mode: jwt
    jwtSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Production-ready profile preset
  productionReady:
    enabled: false
    replicas: 3
    podDisruptionBudget:
      enabled: true
      minAvailable: 2
    antiAffinity:
      enabled: true
      type: hard
  # OpenTelemetry configuration
  opentelemetry:
    enabled: false
    endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    tracing:
      enabled: true
      samplingRatio: 1.0
    metrics:
      enabled: true
      port: 9464
      path: /metrics
    resourceAttributes:
      service.name: kranix-api
      deployment.environment: production
  # Pre-upgrade validation hook
  preUpgradeHook:
    enabled: false
    image:
      repository: bitnami/kubectl
      tag: "latest"
      pullPolicy: IfNotPresent
    checks:
      resources:
        enabled: true
        minCpu: "100m"
        minMemory: "128Mi"
      dependencies:
        enabled: true
        services:
          - kranix-core
      secrets:
        enabled: true
        required:
          - kranix-api-jwt
  # Resource sizing calculator
  resourceCalculator:
    enabled: false
    workloadCount: 100
    tier: small

kranix-operator:
  enabled: true
  replicas: 1
  image:
    tag: "latest"
  leaderElection: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Production-ready profile preset
  productionReady:
    enabled: false
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    antiAffinity:
      enabled: true
      type: hard
  # OpenTelemetry configuration
  opentelemetry:
    enabled: false
    endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    tracing:
      enabled: true
      samplingRatio: 1.0
    metrics:
      enabled: true
      port: 9464
      path: /metrics
    resourceAttributes:
      service.name: kranix-operator
      deployment.environment: production
  # Pre-upgrade validation hook
  preUpgradeHook:
    enabled: false
    image:
      repository: bitnami/kubectl
      tag: "latest"
      pullPolicy: IfNotPresent
    checks:
      resources:
        enabled: true
        minCpu: "50m"
        minMemory: "64Mi"
      dependencies:
        enabled: true
        services:
          - kranix-core
      secrets:
        enabled: true
        required: []
  # Resource sizing calculator
  resourceCalculator:
    enabled: false
    workloadCount: 100
    tier: small

kranix-mcp:
  enabled: false
  replicas: 1
  image:
    tag: "latest"
  service:
    type: ClusterIP
    port: 3100
  safety:
    readonlyMode: false
    allowDeleteWorkload: true

state:
  backend: postgres
  postgres:
    host: ""
    port: 5432
    database: kranix
    existingSecret: kranix-postgres-secret
    secretKey: postgres-password

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false

tracing:
  enabled: false
  endpoint: ""

logging:
  level: info
  format: json
