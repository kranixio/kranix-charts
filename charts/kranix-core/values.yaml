replicaCount: 1

image:
  repository: kranix-core
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 50051

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  reconcile_interval: 15s
  max_concurrent_reconciles: 10

state:
  backend: postgres
  postgres:
    host: ""
    port: 5432
    database: kranix
    existingSecret: ""
    secretKey: postgres-password

nodeSelector: {}

tolerations: []

affinity: {}

# Resource sizing calculator
# Automatically calculates recommended resources based on workload count and tier
resourceCalculator:
  enabled: false
  workloadCount: 100           # Expected number of workloads to manage
  tier: small                   # small, medium, or large deployment tier
  # When enabled, overrides the resources section above

# Production-ready profile preset
# When enabled, sets HA replicas, PodDisruptionBudget, and anti-affinity rules
productionReady:
  enabled: false
  # Overrides replicaCount when enabled
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  antiAffinity:
    enabled: true
    type: hard  # soft or hard

# OpenTelemetry configuration
opentelemetry:
  enabled: false
  # OpenTelemetry Collector endpoint
  endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  # Tracing configuration
  tracing:
    enabled: true
    samplingRatio: 1.0
  # Metrics configuration
  metrics:
    enabled: true
    port: 9464
    path: /metrics
  # Resource attributes
  resourceAttributes:
    service.name: kranix-core
    deployment.environment: production

# Pre-upgrade validation hook
preUpgradeHook:
  enabled: false
  image:
    repository: bitnami/kubectl
    tag: "latest"
    pullPolicy: IfNotPresent
  # Validation checks to run before upgrade
  checks:
    # Check if minimum required resources are available
    resources:
      enabled: true
      minCpu: "100m"
      minMemory: "128Mi"
    # Check if dependent services are ready
    dependencies:
      enabled: true
      services: []
    # Check if required secrets exist
    secrets:
      enabled: true
      required:
        - kranix-postgres-secret
