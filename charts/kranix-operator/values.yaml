replicaCount: 1

image:
  repository: kranix-operator
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

coreAddress: kranix-core.kranix-system.svc.cluster.local:50051

leaderElection: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Resource sizing calculator
# Automatically calculates recommended resources based on workload count and tier
resourceCalculator:
  enabled: false
  workloadCount: 100           # Expected number of workloads to reconcile
  tier: small                   # small, medium, or large deployment tier
  # When enabled, overrides the resources section above

# Production-ready profile preset
# When enabled, sets HA replicas, PodDisruptionBudget, and anti-affinity rules
productionReady:
  enabled: false
  # Overrides replicaCount when enabled
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  antiAffinity:
    enabled: true
    type: hard  # soft or hard

# OpenTelemetry configuration
opentelemetry:
  enabled: false
  # OpenTelemetry Collector endpoint
  endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  # Tracing configuration
  tracing:
    enabled: true
    samplingRatio: 1.0
  # Metrics configuration
  metrics:
    enabled: true
    port: 9464
    path: /metrics
  # Resource attributes
  resourceAttributes:
    service.name: kranix-operator
    deployment.environment: production

# Pre-upgrade validation hook
preUpgradeHook:
  enabled: false
  image:
    repository: bitnami/kubectl
    tag: "latest"
    pullPolicy: IfNotPresent
  # Validation checks to run before upgrade
  checks:
    # Check if minimum required resources are available
    resources:
      enabled: true
      minCpu: "50m"
      minMemory: "64Mi"
    # Check if dependent services are ready
    dependencies:
      enabled: true
      services:
        - kranix-core
    # Check if required secrets exist
    secrets:
      enabled: true
      required: []
