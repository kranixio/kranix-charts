apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kranix-operator.fullname" . }}
  labels:
    {{- include "kranix-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.productionReady.enabled | ternary .Values.productionReady.replicas .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kranix-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kranix-operator.selectorLabels" . | nindent 8 }}
      {{- if .Values.opentelemetry.enabled }}
      annotations:
        prometheus.io/scrape: "{{ .Values.opentelemetry.metrics.enabled }}"
        prometheus.io/port: "{{ .Values.opentelemetry.metrics.port }}"
        prometheus.io/path: "{{ .Values.opentelemetry.metrics.path }}"
      {{- end }}
    spec:
      serviceAccountName: {{ include "kranix-operator.serviceAccountName" . }}
      containers:
        - name: kranix-operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --core-address={{ .Values.coreAddress }}
            - --leader-elect={{ .Values.leaderElection }}
          {{- if .Values.opentelemetry.enabled }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.opentelemetry.resourceAttributes.service.name | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.name=%s,deployment.environment=%s" .Values.opentelemetry.resourceAttributes.service.name .Values.opentelemetry.resourceAttributes.deployment.environment | quote }}
            {{- if .Values.opentelemetry.tracing.enabled }}
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.opentelemetry.tracing.samplingRatio | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.productionReady.enabled }}
      {{- if .Values.productionReady.antiAffinity.enabled }}
      affinity:
        {{- if eq .Values.productionReady.antiAffinity.type "hard" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "kranix-operator.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "kranix-operator.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- end }}
      {{- end }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
