apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kranix-api.fullname" . }}
  labels:
    {{- include "kranix-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kranix-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kranix-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kranix-api.serviceAccountName" . }}
      containers:
        - name: kranix-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if eq .Values.auth.mode "jwt" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecret | default (include "kranix-api.fullname" .) }}
                  key: jwt-secret
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
